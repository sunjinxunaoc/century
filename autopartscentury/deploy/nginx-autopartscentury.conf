# autopartscentury.com - Century AutoParts (vite-ssg static site)
# 整份替换 /etc/nginx/sites-available/autopartscentury.com 后执行:
#   nginx -t && systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name autopartscentury.com www.autopartscentury.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://autopartscentury.com$request_uri;
    }
}

# www -> 根域
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.autopartscentury.com;

    ssl_certificate /etc/letsencrypt/live/autopartscentury.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopartscentury.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://autopartscentury.com$request_uri;
}

# 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autopartscentury.com;

    root /home/autoparts/website;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/autopartscentury.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopartscentury.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 真实 404 状态码
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 带 hash 的构建产物: 1 年长缓存
    # 注意: location 内一旦出现 add_header 就不再继承 server 级安全头, 故各 location 内重复声明
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # 图片: 30 天缓存
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # 搜索索引: 1 小时
    location = /search-index.json {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 无扩展名 URL -> 301 到尾斜杠 (例: /about -> /about/)
    location ~ ^(?<clean>/[^.]*[^/])$ {
        if (-d $document_root$clean) {
            return 301 $clean/;
        }
        try_files $uri =404;
    }

    # 静态页面 (vite-ssg 嵌套 index.html 结构)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/index.html =404;
    }
}
