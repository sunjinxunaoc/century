# AutoParts Century (Century AutoParts) - static site (vite-ssg dist)
# Place dist/ contents at: /var/www/autopartscentury.com
# Tested pattern: nginx >= 1.18, certbot-managed SSL

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name autopartscentury.com www.autopartscentury.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://autopartscentury.com$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.autopartscentury.com;

    ssl_certificate     /etc/letsencrypt/live/autopartscentury.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopartscentury.com/privkey.pem;

    return 301 https://autopartscentury.com$request_uri;
}

# Main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autopartscentury.com;

    root /var/www/autopartscentury.com;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/autopartscentury.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopartscentury.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- Real 404 status with styled page (fixes soft-404) ----
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---- Hashed build assets: long cache ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Images: medium cache ----
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- Search index: short cache ----
    location = /search-index.json {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- Extensionless URLs: 301 to trailing slash (fixes duplicate content) ----
    # Matches paths without a file extension, e.g. /about -> /about/
    location ~ ^(?<clean>/[^.]*[^/])$ {
        if (-d $document_root$clean) {
            return 301 $clean/;
        }
        try_files $uri =404;
    }

    # ---- Static pages (nested index.html layout from vite-ssg) ----
    location / {
        # HTML must revalidate so deploys show up immediately
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
